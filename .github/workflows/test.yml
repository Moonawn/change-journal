name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: PowerShell 7 smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows_smoke.ps1
      - name: Windows PowerShell 5.1 smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows_smoke.ps1
